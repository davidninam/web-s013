<!-- Services section -->
<section class="services-section">
  <div class="section-container">
    <h2 class="section-title">Nuestros Servicios</h2>
    <p class="section-subtitle">Soluciones integrales para impulsar tu transformación digital</p>
    
    <div class="services-grid">
      @for (service of services; track service.title) {
        <mat-card class="service-card">
          <mat-card-header>
            <div class="service-icon">
              <mat-icon>{{ service.icon }}</mat-icon>
            </div>
          </mat-card-header>
          <mat-card-content>
            <h3>{{ service.title }}</h3>
            <p>{{ service.description }}</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button color="primary" routerLink="/servicios">
              Saber más
            </button>
          </mat-card-actions>
        </mat-card>
      }
    </div>
  </div>
</section>
